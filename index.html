<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#08080c" />
    <!-- režim: synchronně, před styly (žádné probliknutí) -->
    <script src="https://www.jan-kuchar.cz/brand/theme.js"></script>
    <link rel="stylesheet" href="https://www.jan-kuchar.cz/brand/tokens.css" />
    <title>Reports Visualizer · AI Statistiky</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- JK grafický manuál – Tailwind v3 preset (definuje jkPreset) -->
    <script src="https://www.jan-kuchar.cz/brand/tailwind-preset.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        presets: [jkPreset],
        theme: {
          extend: {
            // Doplňkové tokeny z tokens.css, které preset nemá
            colors: {
              line: { hover: 'var(--jk-line-3)' },
              accent: { 'strong-hover': 'var(--jk-accent-strong-hover)' },
              success: { DEFAULT: 'var(--jk-success)', soft: 'var(--jk-success-soft)' },
              warning: { DEFAULT: 'var(--jk-warning)', soft: 'var(--jk-warning-soft)' },
              danger: { DEFAULT: 'var(--jk-danger)', soft: 'var(--jk-danger-soft)' },
              info: { DEFAULT: 'var(--jk-info)', soft: 'var(--jk-info-soft)' },
            },
          }
        }
      }
    </script>
    <style>
      html, body { background: var(--jk-bg); }
      body {
        color: var(--jk-text);
        font-family: var(--jk-font);
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      /* Jemná záře nahoře za obsahem */
      body::before {
        content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background: var(--jk-ambient-app);
      }
      a { color: var(--jk-accent); }
      :focus-visible { outline: none; box-shadow: var(--jk-focus); }

      /* Hairline 0,5 px místo stínů */
      .hairline { box-shadow: 0 0 0 .5px var(--jk-line-2) inset; }
      .hairline-soft { box-shadow: 0 0 0 .5px var(--jk-line) inset; }
      .hairline-b { border-bottom: .5px solid var(--jk-line); }
      .hairline-t { border-top: .5px solid var(--jk-line); }
      .hairline-l { border-left: .5px solid var(--jk-line); }
      .shadow-pop { box-shadow: var(--jk-shadow-pop); }
      .glass { background: var(--jk-glass); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); }
      .tnum { font-variant-numeric: tabular-nums; }

      /* Štítek s tečkou */
      .badge-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

      /* Přepínač režimu – manuál, sekce Kód → Přepínač režimu */
      .theme-toggle{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;padding:0;
        color:var(--jk-text-2);background:var(--jk-fill);box-shadow:var(--jk-hairline);border:0;cursor:pointer;
        transition:color .15s,background .15s}
      .theme-toggle:hover{color:var(--jk-text);background:var(--jk-fill-hover)}
      .theme-toggle:focus-visible{outline:none;box-shadow:var(--jk-focus)}
      .theme-toggle svg{width:18px;height:18px}
      [data-theme="light"] .theme-toggle .sun,[data-theme="dark"] .theme-toggle .moon{display:none}

      /* Posuvníky */
      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background-color: var(--jk-surface-3); border-radius: 6px; border: 3px solid var(--jk-bg); }
      ::-webkit-scrollbar-thumb:hover { background-color: var(--jk-line-3); }
      * { scrollbar-width: thin; scrollbar-color: var(--jk-surface-3) transparent; }

      [data-theme="dark"] input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .5; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
