<!DOCTYPE html>
<html lang="cs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#08080c" />
    <title>Reports Visualizer · AI Statistiky</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // JK grafický manuál v1.0 – Tailwind v3 preset (brand/tailwind-preset.js)
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              bg: '#08080c',
              surface: { 1: '#111117', 2: '#18181f', 3: '#22222b' },
              line: { DEFAULT: 'rgba(255,255,255,.10)', strong: 'rgba(255,255,255,.14)', hover: 'rgba(255,255,255,.22)' },
              fg: { DEFAULT: '#f5f5f7', muted: 'rgba(235,235,245,.60)', subtle: 'rgba(235,235,245,.38)' },
              accent: { DEFAULT: '#0a84ff', hover: '#409cff', strong: '#0071e3', 'strong-hover': '#0077ed', soft: 'rgba(10,132,255,.16)' },
              success: { DEFAULT: '#30d158', soft: 'rgba(48,209,88,.16)' },
              warning: { DEFAULT: '#ff9f0a', soft: 'rgba(255,159,10,.16)' },
              danger: { DEFAULT: '#ff453a', soft: 'rgba(255,69,58,.16)' },
              info: { DEFAULT: '#64d2ff', soft: 'rgba(100,210,255,.16)' },
              glass: 'rgba(32,32,40,.72)',
              chart: { 1: '#0a84ff', 2: '#30d158', 3: '#ff9f0a', 4: '#bf5af2', 5: '#ff375f', 6: '#64d2ff', 7: '#ffd60a', 8: '#ac8e68' },
            },
            fontFamily: {
              sans: ['-apple-system', 'BlinkMacSystemFont', '"SF Pro Text"', 'Inter', 'system-ui', 'sans-serif'],
              mono: ['"SF Mono"', 'ui-monospace', '"JetBrains Mono"', 'Menlo', 'Consolas', 'monospace'],
            },
            borderRadius: { kbd: '5px', row: '8px', button: '10px', card: '14px', panel: '18px' },
          }
        }
      }
    </script>
    <style>
      :root { color-scheme: dark; }
      html, body { background: #08080c; }
      body {
        color: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif;
        font-size: 14px;
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      /* Jemná záře nahoře za obsahem (--jk-ambient-app) */
      body::before {
        content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
        background: radial-gradient(70% 40% at 50% -10%, rgba(94,92,230,.14), transparent 70%);
      }
      a { color: #0a84ff; }
      :focus-visible { outline: none; box-shadow: 0 0 0 3px rgba(10,132,255,.45); }

      /* Hairline 0,5 px místo stínů */
      .hairline { box-shadow: 0 0 0 .5px rgba(255,255,255,.14) inset; }
      .hairline-soft { box-shadow: 0 0 0 .5px rgba(255,255,255,.10) inset; }
      .hairline-b { border-bottom: .5px solid rgba(255,255,255,.10); }
      .hairline-t { border-top: .5px solid rgba(255,255,255,.10); }
      .hairline-l { border-left: .5px solid rgba(255,255,255,.10); }
      .shadow-pop { box-shadow: 0 0 0 .5px rgba(255,255,255,.14) inset, 0 40px 100px -20px rgba(0,0,0,.8); }
      .glass { background: rgba(32,32,40,.72); backdrop-filter: blur(30px) saturate(180%); -webkit-backdrop-filter: blur(30px) saturate(180%); }
      .tnum { font-variant-numeric: tabular-nums; }

      /* Štítek s tečkou */
      .badge-dot::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }

      /* Posuvníky – jen tmavý režim */
      ::-webkit-scrollbar { width: 12px; height: 12px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background-color: #22222b; border-radius: 6px; border: 3px solid #08080c; }
      ::-webkit-scrollbar-thumb:hover { background-color: #2c2c37; }
      * { scrollbar-width: thin; scrollbar-color: #22222b transparent; }

      input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); opacity: .5; }

      @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/index.tsx"></script>
  </body>
</html>
